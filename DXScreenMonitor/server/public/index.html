<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DX Screen Monitor</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0b1120; color: #e2e8f0;
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 16px;
    background: #111827; border-bottom: 1px solid #1f2937; }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; flex: 1; }
  header .net { color: #94a3b8; font-size: 12px; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: #64748b; margin-right: 6px; }
  .live .dot { background: #22c55e; } .off .dot { background: #ef4444; }
  main { display: flex; height: calc(100% - 46px); }
  aside { width: 260px; border-right: 1px solid #1f2937; overflow-y: auto; padding: 8px; }
  aside h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: #94a3b8; margin: 8px 6px; }
  .device { display: flex; align-items: center; gap: 8px; padding: 10px; border-radius: 10px; cursor: pointer;
    border: 1px solid transparent; }
  .device:hover { background: #1e293b; }
  .device.sel { background: #1e293b; border-color: #38bdf8; }
  .device .name { flex: 1; font-weight: 600; }
  .device .sub { color: #94a3b8; font-size: 12px; }
  section { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .stage { flex: 1; position: relative; background: #000; display: flex; align-items: center; justify-content: center; }
  video { max-width: 100%; max-height: 100%; background: #000; }
  .hint { position: absolute; color: #94a3b8; text-align: center; padding: 16px; }
  .bar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: #111827; border-top: 1px solid #1f2937;
    flex-wrap: wrap; }
  .bar .stats { color: #94a3b8; font-size: 12px; flex: 1; min-width: 180px; font-variant-numeric: tabular-nums; }
  button { background: #1e293b; color: #e2e8f0; border: 1px solid #334155; border-radius: 8px; padding: 7px 12px;
    font: inherit; cursor: pointer; } button:hover { background: #334155; } button:disabled { opacity: .5; cursor: default; }
  .login { max-width: 340px; margin: 14vh auto; padding: 24px; background: #111827; border-radius: 12px; }
  .login input { width: 100%; padding: 10px; margin: 12px 0; border-radius: 8px; border: 1px solid #334155;
    background: #0b1120; color: #e2e8f0; font: 15px monospace; }
  .err { color: #f87171; font-size: 13px; }
  .hidden { display: none; }
</style>
</head>
<body>
  <div id="login" class="login">
    <h1 style="margin:0 0 4px">DX Screen Monitor</h1>
    <p style="color:#94a3b8">Enter the viewer key to watch the department phones.</p>
    <input id="token" type="password" placeholder="Viewer key" autocomplete="current-password">
    <div id="loginErr" class="err"></div>
    <button id="loginBtn" style="width:100%">Connect</button>
  </div>

  <div id="app" class="hidden" style="height:100%">
    <header>
      <h1><span class="dot"></span>DX Screen Monitor</h1>
      <span class="net" id="net">Connecting…</span>
      <button id="logout">Sign out</button>
    </header>
    <main>
      <aside>
        <h2>Devices (<span id="count">0</span>)</h2>
        <div id="devices"></div>
      </aside>
      <section>
        <div class="stage">
          <video id="video" autoplay playsinline muted></video>
          <div class="hint" id="hint">Pick a device on the left to watch its screen.</div>
        </div>
        <div class="bar">
          <span class="stats" id="stats"></span>
          <button id="full" disabled>Full screen</button>
          <button id="disc" disabled>Disconnect</button>
        </div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
