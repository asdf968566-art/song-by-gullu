name: YouTube Shorts

# Makes one original AI Hindi Short a day (YouTubeAuto/make_short.py), uploads it to the owner's channel once it is
# linked (run this workflow by hand with "login" ticked: the log shows a code for google.com/device), and keeps a
# copy with its title, description and tags in the release youtube-videos.
on:
  schedule:
    - cron: "41 12 * * *"   # 6:11 PM India time, when Shorts get the most views
  workflow_dispatch:
    inputs:
      login:
        description: "Link the YouTube channel (the log shows a code)"
        type: boolean
        default: false
      upload:
        description: "Upload the new video"
        type: boolean
        default: true
  push:
    branches: ["claude/**"]
    paths: ["YouTubeAuto/**", ".github/workflows/youtube.yml"]

permissions:
  contents: write

concurrency:
  group: youtube
  cancel-in-progress: false

jobs:
  short:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        if: ${{ !inputs.login }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-core >/dev/null
          pip install -q --break-system-packages edge-tts gTTS pillow
      - name: Channel state (branch youtube-channel)
        run: |
          git clone -q --depth 1 -b youtube-channel "https://github.com/${{ github.repository }}.git" state \
            || { mkdir -p state && cd state && git init -q -b youtube-channel; }
      - name: Link the channel
        if: ${{ inputs.login }}
        run: |
          python3 YouTubeAuto/youtube_login.py state & pid=$!
          for i in $(seq 30); do [ -s login-code.txt ] && break; sleep 1; done
          # The code also goes to the branch youtube-login, since a running job's log can't be read.
          if [ -s login-code.txt ]; then
            mkdir code && cp login-code.txt code/ && cd code && git init -q -b youtube-login && git add -A
            git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "Login code"
            git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:youtube-login
            cd ..
          fi
          wait $pid
      - name: Make a Short
        if: ${{ !inputs.login }}
        run: |
          # The public Data API key the app already uses, for the trending lists.
          export YT_API_KEY=$(sed -n 's/^sangeet.youtubeApiKey=//p' Sangeet/gradle.properties)
          UP=""
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.upload }}" = "true" ]; then UP="--upload"; fi
          python3 YouTubeAuto/make_short.py state out $UP
      - name: Keep a copy in the release youtube-videos
        if: ${{ !inputs.login }}
        run: |
          gh release view youtube-videos >/dev/null 2>&1 || gh release create youtube-videos --prerelease \
            --title "YouTube Shorts" --notes "Videos made by the YouTube Shorts workflow (newest 20 kept)."
          gh release upload youtube-videos out/short-*.mp4 out/short-*.jpg out/short-*.json --clobber
          gh release view youtube-videos --json assets -q '.assets[].name' | grep '^short-.*\.mp4$' | sort -r | tail -n +21 \
            | while read f; do b=${f%.mp4}; for x in mp4 jpg json; do gh release delete-asset youtube-videos "$b.$x" -y || true; done; done
          for f in out/short-*.mp4; do echo "VIDEO https://github.com/${{ github.repository }}/releases/download/youtube-videos/$(basename $f)"; done
      - name: Save the channel state
        if: github.event_name != 'push' && success()
        run: |
          cd state
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -q -m "YouTube channel state" || exit 0
          git push -q "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:youtube-channel
