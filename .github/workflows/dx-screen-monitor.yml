name: DX Screen Monitor

on:
  push:
    branches: ["main", "claude/**"]
    paths: ["DXScreenMonitor/**", ".github/workflows/dx-screen-monitor.yml", ".github/scripts/dx-*"]
  pull_request:
    paths: ["DXScreenMonitor/**", ".github/workflows/dx-screen-monitor.yml", ".github/scripts/dx-*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dx-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: DXScreenMonitor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug + release APK, unit tests, lint
        env:
          DX_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug assembleRelease testDebugUnitTest lintDebug
          ls -la app/build/outputs/apk/*/
          echo "Lint summary:"; grep -o 'severity="[A-Za-z]*"' app/build/reports/lint-results-debug.xml 2>/dev/null | sort | uniq -c || true
      - uses: actions/upload-artifact@v4
        with:
          name: dx-apk
          path: |
            DXScreenMonitor/app/build/outputs/apk/debug/*.apk
            DXScreenMonitor/app/build/outputs/apk/release/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dx-reports
          path: |
            DXScreenMonitor/app/build/reports/
          if-no-files-found: ignore

  emulator-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dx-apk
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          pip install --quiet --break-system-packages pillow || pip install --quiet pillow
      # Android 12 (API 31), like the Pixel 3 XL. Hardware profile pixel_3_xl: 1440x2960 at 560 dpi.
      - name: Capture test on an Android 12 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          profile: pixel_3_xl
          disable-animations: true
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none
          script: bash .github/scripts/dx-emulator-test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dx-emulator-results
          path: out/
          if-no-files-found: ignore

  publish:
    needs: [build, emulator-test]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dx-apk
          path: apk
      - name: Publish APK to release "dx-screen-monitor"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp apk/release/app-release.apk DXScreenMonitor.apk
          cp apk/debug/app-debug.apk DXScreenMonitor-debug.apk
          gh release delete dx-screen-monitor --yes --cleanup-tag || true
          gh release create dx-screen-monitor DXScreenMonitor.apk DXScreenMonitor-debug.apk \
            --prerelease --title "DX Screen Monitor build ${{ github.run_number }}" \
            --notes "Tested on an Android 12 emulator (Pixel 3 XL screen size) before publishing. Install DXScreenMonitor.apk."
