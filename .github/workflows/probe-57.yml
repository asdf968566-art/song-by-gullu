name: Probe 57

# One-off probe (report #57): JioSaavn's artist pages, lyrics, lyrics.ovh. Removed after use.
on:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/probe-57.yml"]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          api='https://www.jiosaavn.com/api.php?_format=json&_marker=0&api_version=4&ctx=web6dot0'
          ua='Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/124 Mobile Safari/537.36'
          id=459320
          cat > show.py <<'PY'
          import json,sys
          raw=open(sys.argv[1]).read()
          try: d=json.loads(raw)
          except Exception: print(sys.argv[1], "not json:", raw[:150]); sys.exit()
          ts=d.get("topSongs") if isinstance(d,dict) else None
          songs = ts if isinstance(ts,list) else (ts or {}).get("songs") if isinstance(ts,dict) else (d.get("results") if isinstance(d,dict) else None)
          songs = songs or []
          enc = sum(1 for s in songs if (s.get("more_info") or {}).get("encrypted_media_url"))
          print(sys.argv[1], "songs", len(songs), "with media", enc, "total", (ts or {}).get("total") if isinstance(ts,dict) else d.get("total") if isinstance(d,dict) else None)
          if songs:
              s=songs[0]; print("  keys", sorted(s.keys())[:30]); print("  more_info keys", sorted((s.get("more_info") or {}).keys())[:40])
              print("  titles", [x.get("title") for x in songs[:4]], "langs", sorted({x.get("language") for x in songs}))
          PY
          n=0
          for q in "n_song=50&page=1&category=&sort_order=" "n=50&page=1&category=&sort_order=" "n_song=50&page=0&category=latest&sort_order=desc" "n_song=50&page=1&category=popularity&sort_order=desc" "n_song=50&page=2&category=alphabetical&sort_order=asc" "n_song=100&page=1&category=&sort_order="; do
            n=$((n+1)); curl -s -A "$ua" "$api&__call=artist.getArtistMoreSong&artistId=$id&$q" > m$n.json; echo "== MoreSong $q"; python3 show.py m$n.json
          done
          for q in "n_song=50&n_album=0&page=0&category=latest&sort_order=desc" "n_song=100&n_album=0&page=0&category=alphabetical&sort_order=asc"; do
            n=$((n+1)); curl -s -A "$ua" "$api&__call=artist.getArtistPageDetails&artistId=$id&$q" > m$n.json; echo "== PageDetails $q"; python3 show.py m$n.json
          done
          for p in 1 2 3 4; do n=$((n+1)); curl -s -A "$ua" "$api&__call=search.getResults&q=Arijit%20Singh&n=50&p=$p" > m$n.json; echo "== search p$p"; python3 show.py m$n.json; done
          echo "== has_lyrics"
          for q in "tum%20hi%20ho" "channa%20mereya" "lover%20diljit" "raataan%20lambiyan" "kun%20faya%20kun" "brown%20munde"; do
            curl -s -A "$ua" "$api&__call=search.getResults&q=$q&n=10&p=1" | python3 -c 'import json,sys; d=json.load(sys.stdin); print([(x["id"], x["title"][:20], (x.get("more_info") or {}).get("has_lyrics"), (x.get("more_info") or {}).get("lyrics_snippet","")[:30]) for x in d.get("results",[])][:5])'
          done
          for sid in $(curl -s -A "$ua" "$api&__call=search.getResults&q=tum%20hi%20ho&n=10&p=1" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(" ".join(x["id"] for x in d.get("results",[])[:3]))'); do
            echo "lyrics $sid:"; curl -s -A "$ua" "$api&__call=lyrics.getLyrics&lyrics_id=$sid" | head -c 200; echo
            curl -s -A "$ua" "https://www.jiosaavn.com/api.php?__call=lyrics.getLyrics&ctx=web6dot0&api_version=4&_format=json&_marker=0%3F_marker%3D0&lyrics_id=$sid" | head -c 200; echo
          done
