name: Build APK

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
  workflow_dispatch:
  # Daily health check: JioSaavn / YouTube change often; find out the same morning if something broke.
  schedule:
    - cron: "41 2 * * *"

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Sangeet
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK (R8 optimized)
        env:
          # Repo public hai, isliye key Settings → Secrets → Actions mein YOUTUBE_API_KEY naam se rakho.
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          REPORT_TOKEN: ${{ secrets.REPORT_TOKEN }}
        run: |
          if [ -n "$REPORT_TOKEN" ]; then echo "REPORT_TOKEN: set (in-app reports on)"; else echo "::warning::REPORT_TOKEN missing: in-app reports fall back to sharing"; fi
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          # The baseline profile must be inside the APK.
          unzip -l app/build/outputs/apk/release/app-release.apk | grep -E "baseline.prof" || { echo "baseline profile missing"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: Sangeet-apk
          path: Sangeet/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish APK to "latest" release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: .
        run: |
          cp Sangeet/app/build/outputs/apk/release/app-release.apk Sangeet.apk
          gh release delete latest --yes --cleanup-tag || true
          # App ka updater title se "build N" padhta hai.
          gh release create latest Sangeet.apk \
            --title "Sangeet build ${{ github.run_number }}" \
            --notes "Version 1.0.${{ github.run_number }} (build ${{ github.run_number }}) — commit ${GITHUB_SHA::7}. Sangeet.apk download karke install karo, ya app mein Settings → App update."
        env:
          GH_TOKEN: ${{ github.token }}

  # Online services (Audius gaane, LRCLIB lyrics) sach mein chal rahi hain ya nahi.
  api-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash .github/scripts/api-check.sh

  # Emulator pe APK install karke asli gaana bajta hai ya nahi.
  emulator-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: Sangeet-apk
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Play a song on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          disable-animations: true
          # Like a budget phone: small app memory, so a memory-heavy change fails here first.
          ram-size: 2048M
          heap-size: 192M
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none
          script: bash .github/scripts/emulator-test.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-screenshots-and-logs
          path: out/
          if-no-files-found: ignore

  # The daily check failed: open (or update) an issue so it shows up in GitHub notifications.
  health-report:
    if: failure() && github.event_name == 'schedule'
    needs: [build, api-check, emulator-test]
    runs-on: ubuntu-latest
    steps:
      - name: Open an issue
        run: |
          TITLE="Daily check failed: songs may not be playing"
          BODY="The daily app check failed on $(date -u +%F). Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          N=$(gh issue list -R ${{ github.repository }} --state open --search "$TITLE in:title" --json number -q '.[0].number')
          if [ -n "$N" ]; then gh issue comment "$N" -R ${{ github.repository }} --body "$BODY"
          else gh issue create -R ${{ github.repository }} --title "$TITLE" --body "$BODY"; fi
        env:
          GH_TOKEN: ${{ github.token }}
