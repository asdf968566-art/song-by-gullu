name: Build APK

on:
  push:
    branches: ["main", "claude/**"]
    # Notes and the web app don't change the APK.
    paths-ignore: ["docs/**", "CLAUDE.md", "README.md", "SangeetWeb/**"]
  pull_request:
  workflow_dispatch:
  # Daily health check: JioSaavn / YouTube change often; find out the same morning if something broke.
  schedule:
    - cron: "41 2 * * *"

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Sangeet
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK (R8 optimized)
        env:
          # Repo public hai, isliye key Settings → Secrets → Actions mein YOUTUBE_API_KEY naam se rakho.
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          REPORT_TOKEN: ${{ secrets.REPORT_TOKEN }}
        run: |
          if [ -n "$REPORT_TOKEN" ]; then echo "REPORT_TOKEN: set (in-app reports on)"; else echo "::warning::REPORT_TOKEN missing: in-app reports fall back to sharing"; fi
          # Can the token create issues? An issue without a title is refused with 422 when it can (nothing is
          # created), and with 401/403 when it can't.
          if [ -n "$REPORT_TOKEN" ]; then
            # Which token is it (a short fingerprint, not the token), whose account, and until when.
            echo "REPORT_TOKEN fingerprint: $(printf %s "$REPORT_TOKEN" | sha256sum | cut -c1-12)"
            curl -s -D /tmp/rt.h -o /tmp/rt.u -H "Authorization: Bearer $REPORT_TOKEN" https://api.github.com/user
            echo "REPORT_TOKEN account: $(grep -o '"login": *"[^"]*"' /tmp/rt.u | head -1)  $(grep -i '^github-authentication-token-expiration' /tmp/rt.h | tr -d '\r')"
            can() {  # 422 = allowed (an issue without a title is refused, nothing is created); 401/403 = not allowed
              curl -s -o /tmp/rt.json -w '%{http_code}' -X POST -H "Authorization: Bearer $REPORT_TOKEN" \
                -H "Accept: application/vnd.github+json" -H "Content-Type: application/json" -d '{}' "https://api.github.com/repos/$1/issues"
            }
            # Reports go to this repo, or else to a repo of the token's own account (e.g. Vivek's): a fine-grained
            # token can't create issues in another account's repo, even for a collaborator.
            if [ "$(can "${{ github.repository }}")" = 422 ]; then REPORT_REPO="${{ github.repository }}"
            else
              echo "REPORT_TOKEN can't create issues here: $(grep -o '"message": *"[^"]*"' /tmp/rt.json | head -1)"
              for R in $(curl -s -H "Authorization: Bearer $REPORT_TOKEN" "https://api.github.com/user/repos?affiliation=owner&per_page=100" \
                  | python3 -c 'import json,sys; d=json.load(sys.stdin); d=d if isinstance(d,list) else []; d.sort(key=lambda r: 0 if any(w in r["name"].lower() for w in ("sangeet","song","report")) else 1); print(" ".join(r["full_name"] for r in d if r.get("has_issues")))'); do
                if [ "$(can "$R")" = 422 ]; then REPORT_REPO="$R"; break; fi
              done
            fi
            if [ -n "$REPORT_REPO" ]; then echo "REPORT_TOKEN: reports go to $REPORT_REPO ✅"; export REPORT_REPO
            else echo "::warning::REPORT_TOKEN can't create issues in any repo. Give it Issues: Read and write on one of its account's repos (see CLAUDE.md)"; fi
            echo "REPORT_REPO=$REPORT_REPO" >> "$GITHUB_ENV"
          fi
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          # The baseline profile must be inside the APK.
          unzip -l app/build/outputs/apk/release/app-release.apk | grep -E "baseline.prof" || { echo "baseline profile missing"; exit 1; }

      # The same app as an Android App Bundle (.aab), the file Google Play wants.
      - name: Build release bundle for Play Store (.aab)
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          REPORT_TOKEN: ${{ secrets.REPORT_TOKEN }}
          UPLOAD_KEYSTORE_B64: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -n "$UPLOAD_KEYSTORE_B64" ]; then
            echo "$UPLOAD_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            export UPLOAD_KEYSTORE="$RUNNER_TEMP/upload.jks"
            echo "AAB: signed with the private upload key"
          else
            echo "::notice::AAB signed with the app's built-in key (add UPLOAD_KEYSTORE_B64 for a private Play upload key)"
          fi
          ./gradlew --no-daemon bundleRelease
          AAB=app/build/outputs/bundle/release/app-release.aab
          ls -l "$AAB"
          unzip -l "$AAB" | grep -q "base/manifest/AndroidManifest.xml" || { echo "bundle looks broken"; exit 1; }
          jarsigner -verify "$AAB" | tail -1

      - uses: actions/upload-artifact@v4
        with:
          name: Sangeet-apk
          path: Sangeet/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: Sangeet-aab
          path: Sangeet/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Publish APK to "latest" release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: .
        run: |
          cp Sangeet/app/build/outputs/apk/release/app-release.apk Sangeet.apk
          cp Sangeet/app/build/outputs/bundle/release/app-release.aab Sangeet.aab
          gh release delete latest --yes --cleanup-tag || true
          # App ka updater title se "build N" padhta hai (and only picks the .apk).
          gh release create latest Sangeet.apk Sangeet.aab \
            --title "Sangeet build ${{ github.run_number }}" \
            --notes "Version 1.0.${{ github.run_number }} (build ${{ github.run_number }}) — commit ${GITHUB_SHA::7}. Sangeet.apk download karke install karo, ya app mein Settings → App update. Sangeet.aab is for the Google Play Console."
        env:
          GH_TOKEN: ${{ github.token }}

  # Online services (Audius gaane, LRCLIB lyrics) sach mein chal rahi hain ya nahi.
  api-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash .github/scripts/api-check.sh

  # Emulator pe APK install karke asli gaana bajta hai ya nahi.
  emulator-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: Sangeet-apk
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Play a song on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          disable-animations: true
          # Like a budget phone: small app memory, so a memory-heavy change fails here first.
          ram-size: 2048M
          heap-size: 192M
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none
          script: bash .github/scripts/emulator-test.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-screenshots-and-logs
          path: out/
          if-no-files-found: ignore

  # The daily check failed: open (or update) an issue so it shows up in GitHub notifications.
  health-report:
    if: failure() && github.event_name == 'schedule'
    needs: [build, api-check, emulator-test]
    runs-on: ubuntu-latest
    steps:
      - name: Open an issue
        run: |
          TITLE="Daily check failed: songs may not be playing"
          BODY="The daily app check failed on $(date -u +%F). Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          N=$(gh issue list -R ${{ github.repository }} --state open --search "$TITLE in:title" --json number -q '.[0].number')
          if [ -n "$N" ]; then gh issue comment "$N" -R ${{ github.repository }} --body "$BODY"
          else gh issue create -R ${{ github.repository }} --title "$TITLE" --body "$BODY"; fi
        env:
          GH_TOKEN: ${{ github.token }}
