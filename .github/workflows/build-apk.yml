name: Build APK

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Sangeet
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        env:
          # Repo public hai, isliye key Settings → Secrets → Actions mein YOUTUBE_API_KEY naam se rakho.
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Sangeet-debug-apk
          path: Sangeet/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish APK to "latest" release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        working-directory: .
        run: |
          cp Sangeet/app/build/outputs/apk/debug/app-debug.apk Sangeet.apk
          gh release delete latest --yes --cleanup-tag || true
          # App ka updater title se "build N" padhta hai.
          gh release create latest Sangeet.apk \
            --title "Sangeet build ${{ github.run_number }}" \
            --notes "Version 1.0.${{ github.run_number }} (build ${{ github.run_number }}) — commit ${GITHUB_SHA::7}. Sangeet.apk download karke install karo, ya app mein Settings → App update."
        env:
          GH_TOKEN: ${{ github.token }}

  # Online services (Audius gaane, LRCLIB lyrics) sach mein chal rahi hain ya nahi.
  api-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash .github/scripts/api-check.sh

  # Emulator pe APK install karke asli gaana bajta hai ya nahi.
  emulator-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: Sangeet-debug-apk
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Play a song on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          disable-animations: true
          # Like a budget phone: small app memory, so a memory-heavy change fails here first.
          ram-size: 2048M
          heap-size: 192M
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none
          script: bash .github/scripts/emulator-test.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-screenshots-and-logs
          path: out/
          if-no-files-found: ignore
