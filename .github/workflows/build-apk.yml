name: Build APK

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Sangeet
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Sangeet-debug-apk
          path: Sangeet/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish APK to "latest" release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        working-directory: .
        run: |
          cp Sangeet/app/build/outputs/apk/debug/app-debug.apk Sangeet.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Sangeet.apk \
            --title "Sangeet (latest build)" \
            --notes "Commit ${GITHUB_SHA::7} se bana APK. Sangeet.apk download karke phone me install karo."
        env:
          GH_TOKEN: ${{ github.token }}
