name: Web App

# The iPhone-friendly web app (SangeetWeb/) on GitHub Pages.
# The song catalog grows every night: the crawl state is cached between runs.
on:
  push:
    branches: ["main", "claude/**"]
    paths: ["SangeetWeb/**", ".github/workflows/web.yml", ".github/scripts/build-web-catalog.py", ".github/scripts/yt-servers.py", ".github/scripts/build-movies.py", ".github/scripts/community.py", ".github/scripts/data-repo.py", "Sangeet/app/src/main/assets/whats-new.json"]
  schedule:
    # Three crawls a day (2.5 h each) so the catalog grows faster and fewer songs need YouTube.
    - cron: "17 21 * * *"
    - cron: "17 5 * * *"
    - cron: "17 13 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "Minutes to crawl new songs"
        default: "150"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache/restore@v4
        with:
          path: catalog-state
          key: catalog-${{ github.run_id }}
          restore-keys: catalog-
      - name: Build song catalog
        run: |
          pip install -q pycryptodome
          case "${{ github.event_name }}" in
            workflow_dispatch) MIN="${{ inputs.minutes }}" ;;
            schedule) MIN=150 ;;
            # App changes go live fast; the long crawl runs every night.
            *) [ "${{ github.ref }}" = "refs/heads/main" ] && MIN=10 || MIN=8 ;;
          esac
          python .github/scripts/build-web-catalog.py SangeetWeb/data catalog-state/state.json.gz "$MIN" | tee build.log
          grep -E "state:|core |crawl|songs in catalog|TOTAL" build.log >> summary.txt
          du -sh SangeetWeb/data catalog-state | tee -a summary.txt
      # Indian films with release year, music directors, producers, directors and cast (Wikidata), once a week.
      - name: Movie details
        run: |
          M=catalog-state/movies.json
          if [ ! -s "$M" ] || [ $(( $(date +%s) - $(stat -c %Y "$M") )) -gt 604800 ]; then
            timeout 1800 python3 .github/scripts/build-movies.py catalog-state/movies.new.json | tee movies.log \
              && mv catalog-state/movies.new.json "$M" || echo "MOVIES: kept the old list" | tee -a movies.log
          else
            echo "MOVIES: list is less than a week old" | tee movies.log
          fi
          if [ -s "$M" ]; then cp "$M" SangeetWeb/data/movies.json; else echo '[]' > SangeetWeb/data/movies.json; fi
          grep "MOVIES" movies.log >> summary.txt || true
      # Listening data from the apps (Community): what listeners share, for everyone's suggestions.
      - name: Community listening data
        env:
          REPORT_TOKEN: ${{ secrets.REPORT_TOKEN }}
          # Optional: a second token (only here in CI, never in the app) that may write files in the data repo.
          DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
        run: |
          export DATA_REPO=$(python3 .github/scripts/data-repo.py)
          # Only main reads (and closes) the uploads: a branch run keeps its state apart and would lose them.
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then DATA_REPO=""; echo "COMMUNITY: branch run, uploads left for main"; fi
          # The sangeet-*.json files go in an existing folder of the first private repo the token may write files in (CMS first).
          if [ -n "$DATA_REPO" ]; then
            export FOLDER_REPO=$(REPORT_TOKEN="${DATA_TOKEN:-$REPORT_TOKEN}" python3 .github/scripts/data-repo.py --files)
          fi
          echo "COMMUNITY: data repo ${DATA_REPO:-none}, folder repo ${FOLDER_REPO:-none (the token can't write files in any private repo)}" | tee community.log
          python3 .github/scripts/community.py catalog-state/community.json.gz SangeetWeb/data/community.json \
            catalog-state/community-searches.json | tee -a community.log || true
          [ -s SangeetWeb/data/community.json ] || echo '{"tracks":[],"together":{},"top":[]}' > SangeetWeb/data/community.json
          grep -E "COMMUNITY" community.log >> summary.txt || true
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: catalog-state
          key: catalog-${{ github.run_id }}
      # Public servers that give YouTube songs as plain audio (the app's "YouTube in background" option).
      - name: Find YouTube audio servers
        run: |
          timeout 120 python3 .github/scripts/yt-servers.py SangeetWeb/data/yt-servers.json | tee yt.log || true
          [ -s SangeetWeb/data/yt-servers.json ] || echo '[]' > SangeetWeb/data/yt-servers.json
          grep "YT SERVERS" yt.log >> summary.txt || echo "YT SERVERS: none (timed out)" >> summary.txt
      - name: Stamp version
        env:
          # Free Google Gemini key for the AI DJ (owner's choice; it is visible in the site's code, free tier only).
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # The update log, shared with the Android app.
          cp Sangeet/app/src/main/assets/whats-new.json SangeetWeb/whats-new.json
          sed -i "s/__BUILD__/${{ github.run_number }}/g" SangeetWeb/sw.js SangeetWeb/index.html
          K=$(printf %s "$GEMINI_API_KEY" | tr -cd 'A-Za-z0-9_-')
          if [ -n "$K" ]; then sed -i "s/__GEMINI_KEY__/$K/" SangeetWeb/app.js; echo "Gemini: on"; else echo "Gemini: no key"; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: SangeetWeb
      # The Android app reads the popular songs from this release.
      - name: Publish catalog for Android
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p cat && for f in SangeetWeb/data/*.json; do gzip -9c "$f" > "cat/$(basename "$f").gz"; done
          gh release delete catalog --yes --cleanup-tag || true
          gh release create catalog cat/*.gz --prerelease --title "Song catalog" \
            --notes "Popular songs per language for the Android app. Rebuilt every night."
        env:
          GH_TOKEN: ${{ github.token }}

      # Also publish the site to the gh-pages branch (GitHub Pages can serve it from there).
      - name: Publish site to gh-pages branch
        if: github.ref == 'refs/heads/main'
        run: |
          cd SangeetWeb
          touch .nojekyll
          git init -q -b gh-pages
          # No background git housekeeping: it kept writing into .git while it was being removed.
          git config gc.auto 0
          git config maintenance.auto false
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Web app build ${{ github.run_number }}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" gh-pages
          rm -rf .git || { sleep 10; rm -rf .git; }
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Summary
        if: always()
        run: cat summary.txt || true

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    continue-on-error: true
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Is the iPhone site actually reachable?
  check-site:
    if: github.ref == 'refs/heads/main'
    needs: [build, deploy]
    runs-on: ubuntu-latest
    steps:
      - run: |
          URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
            echo "try $i: $CODE"
            [ "$CODE" = "200" ] && { echo "SITE LIVE: $URL"; exit 0; }
            sleep 30
          done
          echo "SITE NOT LIVE: turn on Settings → Pages (source: GitHub Actions, or branch gh-pages)"
