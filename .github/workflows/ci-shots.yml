name: CI screenshots

# Copies the emulator screenshots of the latest finished "Build APK" run of this branch to the `ci-shots`
# branch, so they can be looked at with plain git (artifacts are not reachable from everywhere).
on:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/ci-shots.yml"]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - name: Download screenshots of the latest finished APK run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN=$(gh api "repos/${{ github.repository }}/actions/workflows/build-apk.yml/runs?branch=${{ github.ref_name }}&status=completed&per_page=1" --jq '.workflow_runs[0].id')
          echo "run $RUN"
          gh run download "$RUN" -R "${{ github.repository }}" -n emulator-screenshots-and-logs -D shots
          echo "$RUN" > shots/RUN
          ls -la shots
      - name: Push them to the ci-shots branch
        run: |
          cd shots
          git init -q -b ci-shots
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Screenshots of run $(cat RUN)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-shots
