name: Probe (one-off)
on:
  push:
    branches: ["claude/**"]
    paths: [".github/probe/**", ".github/workflows/probe.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/probe/gemini.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
