name: Probe (one-off)
on:
  push:
    branches: ["claude/**"]
    paths: [".github/probe/**", ".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash .github/probe/reel.sh
      - name: Push the pictures to the probe-shots branch
        run: |
          cd out
          git init -q -b probe-shots
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Reel pictures" || exit 0
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe-shots
