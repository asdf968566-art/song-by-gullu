name: Probe (one-off)
on:
  push:
    branches: ["claude/**"]
    paths: [".github/probe/**", ".github/workflows/probe.yml", ".github/scripts/build-movies.py"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Movies from Wikidata
        run: |
          python3 .github/scripts/build-movies.py movies.json
          ls -l movies.json && gzip -9c movies.json | wc -c
          python3 - <<'PY'
          import json, collections
          m = json.load(open("movies.json"))
          print("films:", len(m)); print("with cast:", sum(1 for f in m if f[6])); print("with producers:", sum(1 for f in m if f[4]))
          print(collections.Counter(l for f in m for l in f[2].split("|") if l).most_common(12))
          for f in m:
              if f[0] in ("Aashiqui 2", "Kabir Singh", "Animal", "Sholay", "Dilwale Dulhania Le Jayenge", "Kesari"):
                  print(f)
          print(m[:3])
          PY
